name: Build CarthoCAD Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.4.41)'
        required: true
        type: string
  repository_dispatch:
    types: [carthocad-release]

env:
  BUNDLE_SRC: setup/CarthoCAD.bundle
  WXS_MAIN: setup/Package.wxs
  HARVESTED: setup/Harvested.wxs

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    steps:
      # ── 1. Determine version from trigger ──────────────────────────
      - name: Set version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'repository_dispatch') {
            $ver = '${{ github.event.client_payload.version }}'
          } else {
            $ver = '${{ inputs.version }}'
          }
          $ver = $ver.TrimStart('v')
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
          "TAG=v$ver" >> $env:GITHUB_OUTPUT
          Write-Output "Building version: $ver"

      # ── 2. Checkout this repository (CarthoCAD_Installer) ──────────
      - name: Checkout Installer repo
        uses: actions/checkout@v4

      # ── 3. Checkout CarthoCAD_23 (private) ─────────────────────────
      - name: Checkout CarthoCAD_23
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/CarthoCAD_23
          token: ${{ secrets.CARTHOCAD_23_PAT }}
          path: CarthoCAD_23

      # ── 4. Setup tooling ──────────────────────────────────────────
      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ── 5. Update AssemblyInfo version to match tag ────────────────
      - name: Update AssemblyInfo version
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.VERSION }}'
          $assemblyVer = "$v.0"
          $asmFile = "CarthoCAD_23/My Project/AssemblyInfo.vb"
          (Get-Content $asmFile) -replace 'AssemblyVersion\("[\d.]+"\)', "AssemblyVersion(""$assemblyVer"")" `
                                 -replace 'AssemblyFileVersion\("[\d.]+"\)', "AssemblyFileVersion(""$assemblyVer"")" |
            Set-Content $asmFile
          Write-Output "Assembly version set to $assemblyVer"

      # ── 6. Restore NuGet packages for CarthoCAD_23 ─────────────────
      #     packages.config places packages in ..\packages\ relative to
      #     the .vbproj, so we restore to a sibling "packages" folder.
      - name: Restore NuGet packages (CarthoCAD_23)
        shell: pwsh
        run: |
          $nuget = (Get-Command nuget.exe -ErrorAction SilentlyContinue).Source
          if (-not $nuget) {
            # Download nuget.exe if not on PATH
            Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile .\nuget.exe
            $nuget = '.\nuget.exe'
          }
          & $nuget restore CarthoCAD_23/packages.config -PackagesDirectory packages

      # ── 7. Build CarthoCAD_23 (Release) ────────────────────────────
      - name: Build CarthoCAD_23 (Release)
        shell: pwsh
        run: |
          msbuild CarthoCAD_23/CarthoCAD_23.vbproj `
            -p:Configuration=Release `
            -p:Platform=AnyCPU `
            -p:OutputPath=bin\Release\ `
            -restore `
            -v:minimal
          if (-not (Test-Path "CarthoCAD_23/bin/Release/CarthoCAD 23.dll")) {
            Write-Error "CarthoCAD 23.dll not found after build"
            exit 1
          }

      # ── 8. Copy build outputs into bundle Contents ──────────────────
      #     Includes: CarthoCAD 23.dll, WebView2 DLLs + runtimes/
      - name: Copy CarthoCAD_23 output to bundle
        shell: pwsh
        run: |
          $releaseDir = "CarthoCAD_23/bin/Release"
          $contentsDir = "$env:BUNDLE_SRC/Contents"

          # Copy all build outputs (DLL, XML, PDB, runtimes, WebView2)
          robocopy "$releaseDir" "$contentsDir" /E /NFL /NDL /NJH /NJS `
            /XF "*.pdb" "*.zip" "acad.err" "GmapsV4_Temp.html" "TEMP01.html"
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Log contents after copy
        shell: pwsh
        run: |
          Write-Output "Build outputs copied to bundle Contents"
          Get-ChildItem "$env:BUNDLE_SRC/Contents" -Recurse | Select-Object FullName

      # ── 9. Update PackageContents.xml version ──────────────────────
      - name: Update AppVersion in PackageContents.xml
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "$env:BUNDLE_SRC/PackageContents.xml")
          $xml.ApplicationPackage.AppVersion = '${{ steps.version.outputs.VERSION }}'
          $xml.Save((Resolve-Path "$env:BUNDLE_SRC/PackageContents.xml").Path)

      # ── 10. Install WiX Toolset ─────────────────────────────────────
      - name: Install WiX Toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.*
          $wixPath = "$env:USERPROFILE\.dotnet\tools"
          echo "$wixPath" >> $env:GITHUB_PATH

      # ── 11. Heat harvest bundle ────────────────────────────────────
      - name: Heat Harvest CarthoCAD.bundle
        shell: pwsh
        run: |
          wix heat dir "$env:BUNDLE_SRC" `
            -out "$env:HARVESTED" `
            -cg CarthoCADComponents `
            -dr INSTALLFOLDER `
            -var var.SourceDir `
            -ag `
            -scom `
            -sreg `
            -srd `
            -nologo

      # ── 12. Build MSI ──────────────────────────────────────────────
      - name: Build MSI
        id: build
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.VERSION }}'
          $msiName = "CarthoCAD v$version.msi"

          wix build "$env:WXS_MAIN" "$env:HARVESTED" `
            -o "$msiName" `
            -d:SourceDir="$env:BUNDLE_SRC" `
            -d:Version="$version" `
            -nologo `
            -v

          if (-not (Test-Path "$msiName")) {
            Write-Error "MSI was not created"
            exit 1
          }
          Write-Output "MSI created: $msiName"
          "MSI_NAME=$msiName" >> $env:GITHUB_OUTPUT

      # ── 13. Create GitHub Release ──────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: CarthoCAD ${{ steps.version.outputs.TAG }}
          body: |
            ## CarthoCAD ${{ steps.version.outputs.TAG }}

            **${{ steps.build.outputs.MSI_NAME }}**

            Instalador WiX para AutoCAD. Instala em `%APPDATA%\Autodesk\ApplicationPlugins\CarthoCAD.bundle`.
          files: ${{ steps.build.outputs.MSI_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
